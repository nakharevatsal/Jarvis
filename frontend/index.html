<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Jarvis Assistant</h1>

        <input
            type="text"
            id="question"
            placeholder="Ask me anything..."
        >

        <button id="askBtn">
            Ask
        </button>

        <h2>Answer</h2>

        <div id="answer"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
